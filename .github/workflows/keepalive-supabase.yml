name: Keep-Alive - Supabase Database (14m Cron)

on:
  schedule:
    # Runs at minutes 0, 14, 28, 42, 56 of every hour
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Gateway
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          ANON_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret in GitHub repository settings."
            exit 1
          fi

          echo "Sending 14-min keep-alive pulse to Supabase REST endpoint: $SUPABASE_URL/rest/v1/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -m 30 "$SUPABASE_URL/rest/v1/" || echo "000")
          echo "Supabase HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Supabase database connection pool is warm and healthy."
          else
            echo "::error::Supabase keep-alive failed with HTTP Status: $HTTP_STATUS"
            exit 1
          fi

