name: Mini-Adhy Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-security-and-cognitive-tests:
    name: Verify Cognitive Security, Approvals & Distributed Invariants
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Execute Security & Cognitive Remediation Test Suite
        env:
          CI: true
        run: npx react-scripts test --watchAll=false

  production-build:
    name: Compile Production Web Application Bundle
    needs: core-security-and-cognitive-tests
    runs-on: ubuntu-latest
    env:
      CI: false
      NODE_ENV: production
      GENERATE_SOURCEMAP: false

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Compile Production Web Bundle
        run: npx react-scripts build
