name: Mini-Adhy Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-security-and-cognitive-tests:
    name: Verify Cognitive Security, Approvals & Distributed Invariants
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Execute Security & Cognitive Remediation Test Suite
        env:
          CI: true
        run: npm test -- --watchAll=false src/

  backend-monolith-verification:
    name: Verify Backend Foundation, Providers & Access Separation
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Fastify Monolith Test Suite
        run: |
          cd backend
          npm test

      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

  production-build:
    name: Compile Production Web Application Bundle
    needs: [core-security-and-cognitive-tests, backend-monolith-verification]
    runs-on: ubuntu-latest
    env:
      CI: false
      NODE_ENV: production
      GENERATE_SOURCEMAP: false

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Web Application
        run: npm run build:web

  studio-build:
    name: Compile Sanity CMS Studio Bundle
    needs: [core-security-and-cognitive-tests, backend-monolith-verification]
    runs-on: ubuntu-latest
    env:
      CI: false
      NODE_ENV: production

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Studio Dependencies
        run: |
          cd studio
          npm ci

      - name: Compile Sanity Studio
        run: |
          cd studio
          npx sanity build ../build/studio --yes
