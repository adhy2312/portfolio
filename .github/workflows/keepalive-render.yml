name: Keep-Alive - Render Backend (14m Cron)

on:
  schedule:
    # Runs at minutes 0, 14, 28, 42, 56 of every hour (never exceeds 14m gap)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend /health Endpoint
        run: |
          RENDER_URL="${{ vars.RENDER_BACKEND_URL || 'https://mini-adhy-backend.onrender.com' }}"
          echo "Sending 14-min keep-alive pulse to: $RENDER_URL/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$RENDER_URL/health" || echo "000")
          echo "Render HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Render backend is warm and healthy (200 OK)."
          else
            echo "Notice: Status was $HTTP_STATUS (Render service may be spinning up)."
          fi
