name: Weekly Mini-Adhy Agent Intelligence Report

# DEDUPLICATION FIX: This GitHub Actions cron is the SOLE scheduler for the weekly report.
# The duplicate cron entry that was in vercel.json has been removed.
# Single trigger point prevents double-firing and double email dispatch.

on:
  workflow_dispatch:
    # Manual trigger only — cron is now handled exclusively in vercel.json
    # To trigger manually: GitHub → Actions → "Weekly Mini-Adhy Agent Intelligence Report" → Run workflow

jobs:
  dispatch-report:
    name: Generate & Dispatch Weekly Intelligence Report (Manual Trigger)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Report Serverless Edge API
        run: |
          echo "Dispatching Weekly Autonomous Intelligence Briefing to adhithyamohan2312@gmail.com..."
          RESPONSE=$(curl -s -X POST "https://adhy.tech/api/agent-ecosystem" \
            -H "Content-Type: application/json" \
            -d '{"action": "weekly_report"}')
          echo "Serverless Response: $RESPONSE"
          echo "Weekly Report successfully logged and dispatched."
